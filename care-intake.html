<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Vitality — GLP-1 Care Intake</title>
<meta name="description" content="Personalized GLP-1 prescription reviewed by Dr. DeBry, MD within 24 hours. Compounded by a USA-licensed 503A pharmacy. Vitality Weight Loss.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#0A2540;
    --navy-2:#13355a;
    --ink:#1a2332;
    --muted:#6e7785;
    --line:#e8e3d6;
    --line-2:#ecead9;
    --cream:#f7f3e9;
    --cream-2:#fbf8ef;
    --bone:#fdfcf6;
    --white:#ffffff;
    --green:#3FA535;
    --green-deep:#2a7a23;
    --green-soft:#86efac;
    --blue:#2E8FE4;
    --accent:#c89456;
    --shadow-1: 0 1px 2px rgba(10,37,64,.06), 0 8px 24px rgba(10,37,64,.06);
    --shadow-2: 0 2px 4px rgba(10,37,64,.08), 0 16px 40px rgba(10,37,64,.10);
    --shadow-lift: 0 1px 0 rgba(10,37,64,.04), 0 2px 4px rgba(10,37,64,.04), 0 10px 30px rgba(10,37,64,.08);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    line-height: 1.55;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content:'';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 10% -10%, rgba(63,165,53,.18) 0%, transparent 45%),
      radial-gradient(circle at 95% 5%, rgba(46,143,228,.16) 0%, transparent 50%),
      radial-gradient(circle at 80% 95%, rgba(200,148,86,.14) 0%, transparent 50%),
      radial-gradient(circle at 10% 95%, rgba(63,165,53,.10) 0%, transparent 55%),
      linear-gradient(180deg, #faf6ec 0%, #f7f3e9 40%, #faf3e8 100%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content:'';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 50% 0%, rgba(255,255,255,.5) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: soft-light;
  }

  /* TOP BAR */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,243,233,.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(10,37,64,.06);
  }
  .topbar-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-logo { width:140px; height:auto; flex-shrink:0; display:block; }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--navy);
    letter-spacing: -.02em;
    line-height: 1;
  }
  .brand-name .sub {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: .22em;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .trust-pill {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .04em;
    display: flex; align-items: center; gap: 6px;
  }
  .trust-pill::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background: var(--green); box-shadow: 0 0 0 3px rgba(63,165,53,.18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }

  /* PROGRESS */
  .progress-bar {
    position: fixed; top: 65px; left: 0; right: 0;
    height: 2px;
    background: rgba(10,37,64,.08);
    z-index: 49;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2a7a23 0%, #3FA535 35%, #2E8FE4 100%);
    width: 0;
    transition: width .55s cubic-bezier(.65,.05,.36,1);
    box-shadow: 0 0 12px rgba(63,165,53,.5), 0 0 24px rgba(46,143,228,.25);
    position: relative;
  }
  .progress-fill::after {
    content:'';
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6));
    animation: progressShimmer 2s linear infinite;
  }
  @keyframes progressShimmer {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* MAIN */
  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 140px;
    min-height: calc(100vh - 64px);
  }
  .screen { animation: enter .55s cubic-bezier(.2,.7,.3,1); }
  @keyframes enter {
    from { opacity:0; transform: translateY(14px); }
    to   { opacity:1; transform: none; }
  }

  /* SECTION TAG */
  .section-tag {
    display: inline-flex; align-items:center; gap:8px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--green-deep);
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .section-tag::before {
    content:''; width:18px; height:1px; background: var(--green-deep); display:block;
  }

  /* TYPOGRAPHY */
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.1;
    letter-spacing: -.025em;
    color: var(--navy);
    margin: 0 0 16px;
  }
  h1 em {
    font-style: italic;
    font-weight: 400;
    background: linear-gradient(120deg, #2a7a23 0%, #3FA535 30%, #2E8FE4 80%, #1f6db3 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    background-size: 200% 200%;
    animation: gradientShift 8s ease-in-out infinite;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--navy);
    margin: 32px 0 12px;
    letter-spacing: -.01em;
  }
  .lede {
    font-size: 16.5px;
    color: var(--muted);
    margin: 0 0 32px;
    line-height: 1.55;
    max-width: 540px;
  }

  /* BACK */
  .back-btn {
    background: none; border: 0;
    color: var(--muted);
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    padding: 4px 0;
    cursor: pointer;
    margin-bottom: 32px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .15s;
  }
  .back-btn:hover { color: var(--navy); }
  .back-btn svg { width:14px; height:14px; }

  /* OPTION CHIPS */
  .opt-group { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 24px; }
  .opt {
    appearance:none; background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    text-align: left; cursor: pointer;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 500;
    color: var(--ink);
    display: flex; align-items: center; gap: 14px;
    transition: all .2s cubic-bezier(.2,.7,.3,1);
    box-shadow: 0 1px 0 rgba(10,37,64,.02);
  }
  .opt:hover {
    border-color: var(--navy);
    transform: translateY(-1px);
    box-shadow: var(--shadow-1);
  }
  .opt .check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--cream-2);
    flex-shrink: 0;
    position: relative;
    transition: all .2s;
  }
  .opt.checkbox .check { border-radius: 6px; }
  .opt.selected {
    border-color: var(--navy);
    background: linear-gradient(180deg, var(--bone) 0%, var(--white) 100%);
    box-shadow: 0 0 0 3px rgba(10,37,64,.06), var(--shadow-1);
  }
  .opt.selected .check { border-color: var(--green); background: var(--green); }
  .opt.selected .check::after {
    content:''; position: absolute;
    left: 6px; top: 2px;
    width: 6px; height: 11px;
    border: solid white; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .opt-body { flex:1; }
  .opt-body small {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 400;
  }

  /* INPUTS */
  .field { display: block; margin-bottom: 14px; }
  .field .lab {
    display:block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: 8px;
  }
  input[type="text"], input[type="email"], input[type="tel"],
  input[type="number"], input[type="date"], textarea, select {
    width: 100%;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    transition: all .18s;
    -webkit-appearance: none;
    box-shadow: 0 1px 0 rgba(10,37,64,.02);
  }
  textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,37,64,.08);
  }
  input::placeholder, textarea::placeholder { color: #b2b8c2; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* CTA */
  .cta {
    display: inline-flex; align-items:center; justify-content:center; gap: 10px;
    background: var(--navy);
    color: var(--white);
    font-family: inherit;
    font-weight: 600;
    font-size: 15.5px;
    padding: 17px 28px;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    transition: all .22s cubic-bezier(.2,.7,.3,1);
    margin-top: 20px;
    box-shadow: 0 1px 2px rgba(10,37,64,.2), 0 6px 18px rgba(10,37,64,.16);
    min-width: 220px;
    letter-spacing: -.005em;
  }
  .cta:hover:not(:disabled) {
    background: var(--navy-2);
    transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(10,37,64,.2), 0 12px 28px rgba(10,37,64,.22);
  }
  .cta:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .cta-green {
    background: linear-gradient(135deg, #4ab33d 0%, #3FA535 35%, #2a7a23 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2),
      0 1px 2px rgba(42,122,35,.3),
      0 10px 28px rgba(42,122,35,.32);
    position: relative;
    overflow: hidden;
  }
  .cta-green::before {
    content:'';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.18) 0%, transparent 50%);
    pointer-events: none;
  }
  .cta-green:hover:not(:disabled) {
    background: linear-gradient(135deg, #3FA535 0%, #2a7a23 50%, #1f5a1a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2),
      0 1px 2px rgba(42,122,35,.3),
      0 16px 36px rgba(42,122,35,.4);
  }
  /* default navy CTA also gets a deeper gradient */
  .cta:not(.cta-green) {
    background: linear-gradient(135deg, #13355a 0%, #0A2540 100%);
  }
  .cta svg { width: 16px; height: 16px; }

  /* HERO */
  .hero { text-align: center; padding-top: 24px; }
  .hero-logo {
    width: 240px; height: auto; display:block;
    margin: 0 auto 32px;
    animation: floaty 4s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .hero h1 {
    font-size: clamp(36px, 6vw, 56px);
    margin-bottom: 18px;
  }
  .hero .lede {
    margin-left: auto; margin-right: auto;
    font-size: 17px;
    max-width: 460px;
  }
  .hero-stat {
    display: inline-block;
    margin: 24px auto 8px;
    padding: 22px 32px;
    background: linear-gradient(180deg, #ffffff 0%, #fdfaf3 100%);
    border-radius: 20px;
    box-shadow: var(--shadow-lift);
    position: relative;
    isolation: isolate;
  }
  .hero-stat::before {
    content:'';
    position: absolute; inset: 0;
    border-radius: 20px;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(63,165,53,.7) 0%, rgba(46,143,228,.5) 50%, rgba(200,148,86,.6) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: -1;
  }
  .hero-stat .big {
    background: linear-gradient(135deg, #0A2540 0%, #2a7a23 70%, #3FA535 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hero-stat .big {
    font-family: 'Fraunces', serif;
    font-size: 44px;
    font-weight: 500;
    color: var(--navy);
    letter-spacing: -.025em;
    line-height: 1;
    display: block;
  }
  .hero-stat .lbl {
    font-size: 11.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .14em;
    margin-top: 6px;
    font-weight: 600;
  }

  /* TRUST */
  .trust-row {
    display: flex; flex-wrap: wrap; gap: 14px 24px;
    justify-content: center;
    margin: 36px 0 10px;
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .trust-row span { display: flex; align-items: center; gap: 6px; }
  .trust-row svg { width: 14px; height: 14px; color: var(--green-deep); }

  /* INFO */
  .info {
    background: var(--white);
    border: 1px solid var(--line);
    border-left: 3px solid var(--blue);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 14px;
    color: var(--ink);
    margin: 22px 0;
    line-height: 1.55;
  }
  .info.warn { border-left-color: var(--accent); background: linear-gradient(180deg, #fdfaf3 0%, var(--white) 100%); }
  .info strong { color: var(--navy); }

  /* DRUG CARDS */
  .drug-cards { display:flex; flex-direction:column; gap: 14px; margin: 18px 0 12px; }
  .drug-card {
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 20px;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.7,.3,1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(10,37,64,.02);
  }
  .drug-card:hover {
    border-color: var(--navy);
    transform: translateY(-2px);
    box-shadow: var(--shadow-2);
  }
  .drug-card.selected {
    border-color: var(--green);
    background:
      radial-gradient(ellipse at top right, rgba(46,143,228,.08) 0%, transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(63,165,53,.10) 0%, transparent 50%),
      linear-gradient(180deg, #f4faec 0%, #ffffff 60%);
    box-shadow: 0 0 0 3px rgba(63,165,53,.18), var(--shadow-2);
  }
  .drug-card .pill {
    background: linear-gradient(135deg, #fef6e4 0%, #fdebc9 100%);
    color: var(--navy);
    box-shadow: 0 1px 2px rgba(200,148,86,.25);
  }
  .drug-card h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--navy);
    margin: 0 0 6px;
    letter-spacing: -.015em;
  }
  .drug-card .from {
    font-size: 13px;
    color: var(--green-deep);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .drug-card .body {
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 12px;
    line-height: 1.55;
  }
  .drug-card .disc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    padding-top: 12px;
    border-top: 1px solid var(--line-2);
  }
  .drug-card .pill {
    position: absolute; top: 16px; right: 16px;
    font-size: 10px; font-weight: 700;
    background: var(--cream); color: var(--navy);
    padding: 5px 10px; border-radius: 99px;
    letter-spacing: .08em; text-transform: uppercase;
  }

  /* CONSENT */
  /* CONSENT CARD — column layout: header banner on top, body row below */
  .ack-card {
    display: flex; flex-direction: column; gap: 0;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    margin-bottom: 14px;
    transition: all .22s cubic-bezier(.2,.7,.3,1);
    overflow: hidden;
  }
  .ack-card:hover { border-color: var(--navy); box-shadow: 0 1px 0 rgba(10,37,64,.04), 0 6px 18px rgba(10,37,64,.06); }
  .ack-card.checked {
    border-color: var(--green);
    background: linear-gradient(180deg, #f4faec 0%, var(--white) 100%);
    box-shadow: 0 0 0 3px rgba(63,165,53,.12), 0 1px 0 rgba(10,37,64,.04);
  }

  /* TOP BANNER — full-width, prominent */
  .ack-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -.005em;
    line-height: 1.4;
    border-bottom: 1px solid transparent;
    transition: all .25s ease;
  }
  .ack-banner svg { width:16px; height:16px; flex-shrink:0; }
  .ack-banner.todo {
    background: linear-gradient(180deg, #fff8e8 0%, #fef6e4 100%);
    border-bottom-color: #f0d896;
    color: #92510a;
  }
  .ack-banner.done {
    background: linear-gradient(180deg, #ecfdf5 0%, #f0fdf4 100%);
    border-bottom-color: #a7f3d0;
    color: #065f46;
  }

  /* BODY ROW — checkbox + text */
  .ack-body { display: flex; gap: 14px; padding: 16px 20px; cursor: pointer; }
  .ack-card input[type="checkbox"] {
    margin-top: 3px; width: 20px; height: 20px;
    accent-color: var(--green); cursor: pointer; flex-shrink: 0;
  }
  .ack-card.locked input[type="checkbox"] { cursor: not-allowed; opacity: .3; }
  .ack-text { font-size: 14.5px; color: var(--ink); line-height: 1.55; flex: 1; }
  .ack-text strong { color: var(--navy); }

  /* LOCKED-state visual cue on the open-document expander */
  .ack-card.locked details.doc summary {
    background: linear-gradient(135deg, var(--accent) 0%, #b07f49 100%);
    color: #fff;
    padding: 11px 14px;
    border-radius: 10px;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(200,148,86,.3);
    border: 0;
  }
  .ack-card.locked details.doc { border: 0; padding: 0; background: transparent; }
  .ack-card.locked details.doc summary::after { color: #fff; font-size: 18px; }
  .ack-card.locked details.doc summary:hover { background: linear-gradient(135deg, #b07f49 0%, #9b6f3f 100%); }

  details.doc {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    background: var(--cream-2);
    margin-top: 10px;
  }
  details.doc summary {
    cursor: pointer; outline: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    list-style: none;
    display: flex; align-items: center; justify-content: space-between;
  }
  details.doc summary::-webkit-details-marker { display: none; }
  details.doc summary::after {
    content: '+'; font-size: 18px; color: var(--muted); transition: transform .2s;
  }
  details.doc[open] summary::after { transform: rotate(45deg); }
  details.doc[open] { background: var(--white); }
  details.doc h4 {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 14px; color: var(--navy); margin: 14px 0 4px;
  }
  details.doc p {
    font-size: 13px; color: var(--ink); margin: 0 0 8px; line-height: 1.55;
  }

  /* SIGNATURE */
  .sig-wrap {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    margin: 28px 0 16px;
    box-shadow: var(--shadow-lift);
  }
  .sig-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .sig-preview {
    font-family: 'Caveat', 'Brush Script MT', cursive;
    font-size: 44px;
    color: var(--navy);
    padding: 12px 0 6px;
    border-bottom: 1.5px dashed var(--line);
    min-height: 64px;
    line-height: 1;
    margin-bottom: 18px;
  }
  .sig-preview.empty { color: #c8cdd5; font-style: italic; font-size: 16px; font-family: 'Inter', sans-serif; }
  .sig-meta {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.55;
  }

  /* SUBMITTED / DQ */
  .center-card {
    text-align: center;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 44px 32px;
    box-shadow: var(--shadow-lift);
  }
  .center-card .icon-wrap {
    width: 72px; height: 72px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(63,165,53,.32);
  }
  .center-card .icon-wrap svg { width: 38px; height: 38px; color: white; }
  .next-steps {
    background: var(--cream-2);
    border-radius: 14px;
    padding: 18px 20px;
    text-align: left;
    margin: 24px 0;
  }
  .next-steps h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--navy);
  }
  .next-steps ol { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink); }
  .next-steps li { margin-bottom: 8px; line-height: 1.55; }

  /* MISC */
  .footer-note {
    text-align: center;
    margin-top: 24px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .skip-info {
    font-size: 12.5px; color: var(--muted);
    margin-top: 10px; text-align: center;
  }

  /* MOBILE */
  @media (max-width: 520px) {
    .topbar-inner { padding: 12px 18px; }
    main { padding: 40px 20px 120px; }
    .trust-pill { display: none; }
    h1 { font-size: 28px; }
    .hero h1 { font-size: 36px; }
    .hero-stat .big { font-size: 36px; }
    .cta { width: 100%; }
    .row { grid-template-columns: 1fr; }
    .lang-toggle { margin-right: 0; }
  }

  /* LANGUAGE TOGGLE */
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .lang-toggle { display: inline-flex; align-items: center; background: var(--cream-2, #f1ece0); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .lang-toggle .lang-opt { appearance: none; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: all .18s; line-height: 1; }
  .lang-toggle .lang-opt:hover { color: var(--navy); }
  .lang-toggle .lang-opt.active { background: var(--navy); color: #fff; box-shadow: 0 1px 3px rgba(10,37,64,.25); }
</style>
</head>

<script>
// CONFIG ---------------------------------------------------------------------
// Clover hosted-checkout URLs per track.
// Each Clover button should be set up as: 1x $XX intro charge + 5x recurring $YY/mo.
const CLOVER_URL_SEMA = 'https://link.clover.com/urlshortener/fw4vjT';  // sema inj: $145 intro / $199 x5
const CLOVER_URL_TIRZ = 'https://link.clover.com/urlshortener/2T5N7F';  // tirz inj: $249 intro / $399 x5
const CLOVER_URL_ORAL = 'https://link.clover.com/urlshortener/9h9CJ7';  // oral sema: $199 intro / $299 x5
const PRICING = {
  sema: { intro: 145, monthly: 199, label: '$145 first month · $199/mo thereafter', term: 1140 },
  tirz: { intro: 249, monthly: 399, label: '$249 first month · $399/mo thereafter', term: 2244 },
  oral: { intro: 199, monthly: 299, label: '$199 first month · $299/mo thereafter', term: 1694 }
};
const PHARMACY = { name: 'a USA-licensed 503A compounding pharmacy', license: '', city: 'Las Vegas, NV' };
const CLINICIAN = { name: 'Peter DeBry, MD', npi: '1831137991' };

// STATE ----------------------------------------------------------------------
const STORAGE_KEY = 'vitality_glp1_intake_v1';
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let currentIdx = 0;
const root = document.getElementById('root');
const progressFill = document.getElementById('progressFill');

// HELPERS --------------------------------------------------------------------
function h(tag, attrs, children) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'onClick') el.onclick = attrs[k];
    else if (k === 'html') el.innerHTML = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => {
    if (typeof c === 'string') el.appendChild(document.createTextNode(c));
    else if (c) el.appendChild(c);
  });
  return el;
}
function setProgress(p) { progressFill.style.width = (p*100) + '%'; }
function go(idx) {
  if (idx < 0 || idx >= flow.length) return;
  currentIdx = idx;
  const screen = flow[idx];
  if (screen.relevantWhen && !screen.relevantWhen(state)) return go(idx + 1);
  render(screen);
  setProgress((idx+1) / flow.length);
  save();
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function next() { go(currentIdx + 1); }
function back() {
  let i = currentIdx - 1;
  while (i >= 0 && flow[i].relevantWhen && !flow[i].relevantWhen(state)) i--;
  if (i >= 0) go(i);
}
function disqualify(reason, isCrisis) {
  state.disqualifiedReason = reason;
  state.crisis = !!isCrisis;
  save();
  render({ id: 'dq', section: 'Result', view: viewDisqualify });
  setProgress(1);
}
function render(screen) {
  root.innerHTML = '';
  const wrap = h('div', { class: 'screen' });
  if (currentIdx > 0 && screen.id !== 'dq' && screen.id !== 'submitted') {
    const b = h('button', { class: 'back-btn', type:'button' });
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Back';
    b.onclick = back;
    wrap.appendChild(b);
  }
  if (screen.section) {
    const tag = h('div', { class: 'section-tag' }); tag.textContent = screen.section;
    wrap.appendChild(tag);
  }
  screen.view(wrap);
  root.appendChild(wrap);
}

// CHIPS ----------------------------------------------------------------------
function singleSelectChip(parent, key, options, opts={}) {
  const group = h('div', { class: 'opt-group' });
  options.forEach(o => {
    const btn = h('button', { class:'opt', type:'button' }, [
      h('span', { class:'check' }),
      h('div', { class:'opt-body' }, [
        document.createTextNode(o.label),
        o.sub ? h('small', {}, [document.createTextNode(o.sub)]) : null
      ])
    ]);
    if (state[key] === o.value) btn.classList.add('selected');
    btn.onclick = () => {
      state[key] = o.value; save();
      [...group.children].forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      if (opts.onSelect) opts.onSelect(o.value);
      setTimeout(() => {
        if (opts.disqualifyValues && opts.disqualifyValues.includes(o.value)) {
          return disqualify(opts.disqualifyReason || 'Based on your answer, this program isn\'t the right fit.', opts.crisis);
        }
        next();
      }, 280);
    };
    group.appendChild(btn);
  });
  parent.appendChild(group);
}

function textInput(parent, key, label, ph, type, opts={}) {
  const wrap = h('label', { class:'field' }, [ h('span', { class:'lab' }, [label]) ]);
  const input = h('input', { type: type||'text', placeholder: ph||'', value: state[key]||'' });
  input.oninput = e => { state[key] = e.target.value; save(); if (opts.onChange) opts.onChange(); validateCta(); };
  if (opts.autocomplete) input.setAttribute('autocomplete', opts.autocomplete);
  wrap.appendChild(input);
  parent.appendChild(wrap);
}

function ctaArrow() {
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
  s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2.2');
  s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
  s.innerHTML = '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>';
  return s;
}

function ctaBtn(parent, opts={}) {
  const btn = h('button', { class:'cta cta-green', type:'button' }, [
    document.createTextNode(opts.text || 'Continue'),
    ctaArrow()
  ]);
  btn.id = opts.id || 'mainCta';
  btn.onclick = opts.onClick || next;
  if (opts.disabled) btn.disabled = true;
  parent.appendChild(btn);
  validateCta();
  return btn;
}

function validateCta() {
  const cta = document.getElementById('mainCta');
  if (!cta) return;
  const screen = flow[currentIdx];
  if (!screen || !screen.canContinue) { cta.disabled = false; return; }
  cta.disabled = !screen.canContinue(state);
}

    state.acksRead = state.acksRead || {};

    const _todoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    const _doneIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const _bannerTodoText = _ackEs ? 'Abre el documento completo abajo antes de marcar.' : 'Open the full document below before checking.';
    const _bannerDoneText = _ackEs ? 'Documento leído. Ya puedes marcar la casilla.' : 'Document read. You can now check the box.';

    ACKS.forEach(a => {
      const alreadyRead = !!state.acksRead[a.id];
      const card = h('div', { class:'ack-card' + (state.acks[a.id] ? ' checked' : '') + (alreadyRead ? '' : ' locked') });

      // TOP BANNER — full-width pill at the top of the card
      const banner = h('div', { class: 'ack-banner ' + (alreadyRead ? 'done' : 'todo') });
      banner.innerHTML = (alreadyRead ? _doneIcon : _todoIcon) + '<span>' + (alreadyRead ? _bannerDoneText : _bannerTodoText) + '</span>';
      card.appendChild(banner);

      // BODY ROW — checkbox + text (the original layout)
      const body = h('div', { class: 'ack-body' });
      const cb = h('input', { type:'checkbox' });
      cb.checked = !!state.acks[a.id];
      if (!alreadyRead) cb.disabled = true;
      cb.onchange = e => {
        if (cb.disabled) { e.target.checked = false; return; }
        state.acks[a.id] = e.target.checked;
        card.classList.toggle('checked', e.target.checked);
        save(); validateAll();
      };
      body.appendChild(cb);

      const txt = h('div', { class:'ack-text' });
      const para = h('div', { class:'notrans' }); para.innerHTML = a.html; txt.appendChild(para);
      const det = h('details', { class:'doc' });
      const sum = h('summary');
      sum.textContent = (window.__LANG==='es')
        ? (alreadyRead ? 'Leer de nuevo el documento completo' : '📖 Abrir y leer el documento completo (requerido)')
        : (alreadyRead ? 'Read the full document again' : '📖 Open & read the full document (required)');
      det.appendChild(sum);
      const docBody = h('div', { class:'notrans' });
      docBody.innerHTML = ((window.__LANG==='es' && window.DOCS_ES) ? window.DOCS_ES : DOCS)[a.doc];
      det.appendChild(docBody);
      // Unlock the checkbox the first time the user opens this document.
      det.addEventListener('toggle', () => {
        if (det.open && !state.acksRead[a.id]) {
          state.acksRead[a.id] = true;
          card.classList.remove('locked');
          cb.disabled = false;
          banner.className = 'ack-banner done';
          banner.innerHTML = _doneIcon + '<span>' + _bannerDoneText + '</span>';
          sum.textContent = (window.__LANG==='es') ? 'Leer de nuevo el documento completo' : 'Read the full document again';
          save();
        }
      });
      txt.appendChild(det);
      body.appendChild(txt);
      card.appendChild(body);

      body.onclick = e => {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SUMMARY' && e.target.tagName !== 'A' && !e.target.closest('details')) {
          if (cb.disabled) {
            if (!det.open) det.open = true;
            return;
          }
          cb.checked = !cb.checked; cb.dispatchEvent(new Event('change'));
        }
      };
      p.appendChild(card);
    });

    const sig = h('div', { class:'sig-wrap' });
    sig.appendChild(h('div', { class:'sig-label' }, ['Type your full legal name to sign']));
    const sigPrev = h('div', { class:'sig-preview' + (state.sigName ? '' : ' empty') });
    sigPrev.textContent = state.sigName || 'Your signature appears here';
    sig.appendChild(sigPrev);
    const sigIn = h('input', { type:'text', placeholder:'First Last', value: state.sigName||'' });
    sigIn.oninput = e => {
      state.sigName = e.target.value; save();
      sigPrev.textContent = e.target.value || 'Your signature appears here';
      sigPrev.classList.toggle('empty', !e.target.value);
      validateAll();
    };
    sig.appendChild(sigIn);
    sig.appendChild(h('div', { class:'sig-meta' }, ['By typing your name you sign under E-SIGN, UETA, and Nevada law. Your typed name has the same legal effect as a handwritten signature. A signed copy will be emailed to you.']));
    p.appendChild(sig);

    const submit = h('button', { class:'cta cta-green', type:'button', id:'submitBtn', disabled:'true' }, [
      document.createTextNode('Submit & Continue to Payment')
    ]);
    submit.onclick = submitIntake;
    p.appendChild(h('div', { style:'text-align:center;' }, [submit]));
    p.appendChild(h('div', { class:'skip-info' }, ['Secure Clover checkout · Cancel anytime']));

    function validateAll() {
      const allAcks = ACKS.every(a => a.optional || state.acks[a.id]);
      const sigOk = (state.sigName||'').trim().split(' ').filter(Boolean).length >= 2;
      submit.disabled = !(allAcks && sigOk);
    }
    validateAll();
  }}
];

async function submitIntake() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = (window.__LANG==='es') ? 'Enviando…' : 'Submitting…';
  state.signedAt = new Date().toISOString();
  state.userAgent = navigator.userAgent;
  state.pageUrl = window.location.href;
  save();
  try {
    // Posts to our own Convex CRM. This also alerts Fred (sendLeadAlert).
    // The full signed intake stays in localStorage on the device and the
    // clinical detail rides along in health_notes for the CRM record.
    await fetch('https://quixotic-cat-492.convex.site/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        first_name: state.firstName || '',
        last_name:  state.lastName  || '',
        email:      state.email     || '',
        phone:      state.phone     || '',
        dob:        state.dob       || undefined,
        source: 'vitality_direct',
        source_detail: 'GLP-1 Care Intake' + (state.drug ? ' \u00b7 ' + state.drug : '') +
                       (state.disqualifiedReason ? ' \u00b7 NOT ELIGIBLE' : ''),
        health_notes: [
          state.drug ? ('Requested: ' + state.drug) : '',
          (state.heightFt || state.heightIn) ? ('Height: ' + (state.heightFt||'?') + '\'' + (state.heightIn||0) + '\"') : '',
          state.allergies ? ('Allergies: ' + state.allergies) : '',
          state.currentMeds ? ('Current meds: ' + state.currentMeds) : '',
          (state.addrCity || state.addrState || state.addrZip)
            ? ('Ships to: ' + [state.addrCity, state.addrState, state.addrZip].filter(Boolean).join(', ')) : '',
          state.disqualifiedReason ? ('NOT ELIGIBLE: ' + state.disqualifiedReason) : '',
          state.crisis ? ('CRISIS FLAG: ' + state.crisis) : '',
          state.sigName ? ('Signed by ' + state.sigName + ' at ' + (state.signedAt||'')) : ''
        ].filter(Boolean).join(' \u00b7 '),
        tags: ['GLP-1 Care Intake', state.drug || 'Unspecified']
              .concat(state.disqualifiedReason ? ['Not eligible'] : ['Eligible'])
              .concat(state.crisis ? ['CRISIS'] : [])
              .concat(state.acks && state.acks[5] ? ['sms-consent'] : []),
        consent: true
      })
    }).then(r => r.json()).catch(err => console.error('submit fail:', err));
  } catch(e) { console.error(e); }
  render({ id:'submitted', section:'Submitted', view: viewSubmitted });
  setProgress(1);
}
