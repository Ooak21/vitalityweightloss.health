title = "Production source secret audit"

[extend]
useDefault = true

[[rules]]
id = "ibs-supabase-secret-key"
description = "Supabase privileged secret key"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}\b'''
keywords = ["sb_secret_"]

[[rules]]
id = "ibs-provider-secret-key"
description = "Stack-specific provider or webhook credential"
regex = '''\b(?:xai-[A-Za-z0-9_-]{30,}|re_[A-Za-z0-9_]{25,}|whsec_[A-Za-z0-9+/=]{20,})'''
keywords = ["xai-", "re_", "whsec_"]

[[rules]]
id = "ibs-wallet-private-key"
description = "Literal wallet private key assignment"
regex = '''(?i)(?:private_?key|agent_pk)\s*[:=]\s*["']((?:0x)?[a-f0-9]{64})["']'''
secretGroup = 1
keywords = ["privatekey", "private_key", "agent_pk"]

# No directory, generated bundle, docs or sourcemap bypass. The only exceptions are the reviewed entries at the
# end of this file.
# Gitleaks' upstream default exclusions still apply; this is a pattern audit.

# ---- Accepted findings, reviewed by hand 2026-11-23 ----
# Values that are not credentials are matched exactly. Old commits are matched by full SHA: a commit never
# changes, so listing one cannot hide a new leak. Anything not listed here still fails the audit.

[[allowlists]]
description = "Names the intake forms use to save a draft in the browser (localStorage), not credentials"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^vitality_(?:glp1|bloom)_intake_v1$''']
