<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Set your password · Vitality Weight Loss</title>
<style>
  :root { --blue:#0a6cf5; --blue-d:#0856c8; --ink:#16201d; --muted:#6b7280; --line:#e6e9ee; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif; background:#eef2f7; color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 24px 60px rgba(11,18,32,.12); }
  .head { background:#0b1220; color:#fff; padding:26px 28px; }
  .head .brand { font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#5aa0ff; }
  .head h1 { margin:8px 0 0; font-size:22px; font-weight:800; }
  .head p { margin:6px 0 0; font-size:13.5px; color:#aeb9cc; line-height:1.5; }
  .body { padding:24px 28px 28px; }
  label { display:block; font-size:12.5px; font-weight:600; color:#3d4a45; margin:14px 0 5px; }
  input[type=password], input[type=text] { width:100%; border:1px solid #d7dce4; border-radius:11px; padding:11px 13px; font-size:15px; outline:none; }
  input:focus { border-color:var(--blue); }
  .row { position:relative; }
  .show { position:absolute; right:10px; top:9px; font-size:12px; color:var(--blue); background:none; border:none; cursor:pointer; padding:4px; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  button.primary { width:100%; margin-top:20px; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  button.primary:hover { background:var(--blue-d); }
  button.primary:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:14px; font-size:13.5px; line-height:1.5; }
  .msg.err { color:#be123c; }
  .center { text-align:center; }
  .done-ico { font-size:40px; line-height:1; margin-bottom:8px; }
  a.signin { display:inline-block; margin-top:16px; background:var(--blue); color:#fff; text-decoration:none; border-radius:12px; padding:12px 26px; font-weight:700; font-size:15px; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">Vitality Weight Loss</div>
      <h1 id="hTitle">Set your password</h1>
      <p id="hSub">Create a password for your patient portal.</p>
    </div>
    <div class="body" id="body">
      <p class="muted">Checking your link…</p>
    </div>
  </div>

<script>
  var CONVEX_URL = "https://quixotic-cat-492.convex.site";
  var token = new URLSearchParams(location.search).get("token") || "";
  var body = document.getElementById("body");
  var hSub = document.getElementById("hSub");

  function esc(s){ return String(s||"").replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function showError(msg){
    hSub.textContent = "";
    body.innerHTML = '<p class="msg err">'+esc(msg)+'</p><p class="muted" style="margin-top:12px">Contact the clinic and ask them to send a new link.</p>';
  }

  function showForm(email){
    hSub.textContent = "For " + email;
    body.innerHTML =
      '<label>New password</label>'+
      '<div class="row"><input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="show" id="tog">Show</button></div>'+
      '<label>Confirm password</label>'+
      '<div class="row"><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password"></div>'+
      '<div class="hint">Use at least 8 characters.</div>'+
      '<button class="primary" id="go">Set password</button>'+
      '<div class="msg err" id="ferr" style="display:none"></div>';
    var pw=document.getElementById("pw"), pw2=document.getElementById("pw2"), go=document.getElementById("go"), ferr=document.getElementById("ferr");
    document.getElementById("tog").onclick=function(){ var t=pw.type==="password"; pw.type=pw2.type=t?"text":"password"; this.textContent=t?"Hide":"Show"; };
    function fail(m){ ferr.textContent=m; ferr.style.display="block"; }
    go.onclick=async function(){
      ferr.style.display="none";
      var a=pw.value, b=pw2.value;
      if(a.length<8) return fail("Password must be at least 8 characters.");
      if(a!==b) return fail("The passwords do not match.");
      go.disabled=true; go.textContent="Setting…";
      try{
        var r=await fetch(CONVEX_URL+"/portal-set-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"set",token:token,password:a})});
        var j=await r.json().catch(function(){return{};});
        if(j.ok){ showDone(); }
        else { fail(j.error||"Could not set your password. The link may have expired."); go.disabled=false; go.textContent="Set password"; }
      }catch(e){ fail("Network error. Please try again."); go.disabled=false; go.textContent="Set password"; }
    };
    pw2.addEventListener("keydown",function(e){ if(e.key==="Enter") go.click(); });
  }

  function showDone(){
    hSub.textContent="";
    document.getElementById("hTitle").textContent="You're all set";
    body.innerHTML='<div class="center"><div class="done-ico">✅</div><p class="msg">Your password is set. You can sign in to your patient portal now.</p><a class="signin" href="portal-login.html">Sign in</a></div>';
  }

  (async function(){
    if(!token){ showError("This link is missing its token."); return; }
    try{
      var r=await fetch(CONVEX_URL+"/portal-set-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"validate",token:token})});
      var j=await r.json().catch(function(){return{};});
      if(j.ok){ showForm(j.email); }
      else if(j.reason==="expired"){ showError("This link has expired."); }
      else if(j.reason==="used"){ showError("This link was already used."); }
      else { showError("This link is not valid."); }
    }catch(e){ showError("We couldn't check your link. Please try again."); }
  })();
</script>
</body>
</html>
