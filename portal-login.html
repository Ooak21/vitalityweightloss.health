<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in My Vitality</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#ffffff;color:#16201d}
  .font-display{font-family:'Montserrat','Inter',sans-serif}
  .glow{background:radial-gradient(60% 50% at 50% 0%,rgba(10,108,245,0.08),rgba(10,108,245,0) 70%)}
  .field{width:100%;background:#ffffff;border:1px solid #e6e9ee;border-radius:12px;padding:.8rem 1rem;color:#16201d;font-size:1rem}
  .field:focus{outline:none;border-color:#0a6cf5;box-shadow:0 0 0 3px rgba(10,108,245,.12)}
  .field::placeholder{color:#9aa0ab}
</style>
  <script src="/ga.js" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center px-5">
<div class="absolute inset-0 glow pointer-events-none"></div>
<div class="relative z-10 w-full max-w-sm">
  <div class="flex items-center justify-center gap-2.5 mb-8">
    <img src="assets/logo-icon.png" alt="Vitality Weight Loss" class="h-9 w-auto">
    <span class="font-display flex flex-col items-center leading-none"><span class="font-semibold text-2xl uppercase tracking-[.15em]">Vitality</span><span class="text-[.6rem] font-medium tracking-[.3em] uppercase text-[#16201d] mt-1">Weight Loss</span></span>
  </div>
  <form id="loginForm" class="bg-white shadow-[0_18px_44px_-22px_rgba(16,24,40,0.18)] border border-[#e6e9ee] rounded-3xl p-7">
    <h1 class="font-display text-xl font-semibold mb-1">Welcome to your portal</h1>
    <p class="text-sm text-[#6b7280] mb-6">Sign in to see your progress and plan.</p>
    <label class="text-xs font-semibold text-[#3d4a45]">Email</label>
    <input id="email" type="email" class="field mt-1 mb-4" placeholder="you@email.com" autocomplete="username" required>
    <label class="text-xs font-semibold text-[#3d4a45]">Password</label>
    <input id="password" type="password" class="field mt-1 mb-5" placeholder="••••••••" autocomplete="current-password" required>
    <button type="submit" id="btn" class="w-full px-6 py-3 rounded-2xl bg-[#0a6cf5] text-white font-semibold hover:bg-[#0856c8] transition active:scale-[0.99]">Sign in</button>
    <div id="err" class="text-sm text-rose-600 mt-3 hidden"></div>
    <button type="button" id="forgotLink" class="w-full text-center text-sm text-[#0a6cf5] font-semibold mt-3 hover:underline">Forgot password?</button>
  </form>
  <div id="resetPanel" class="hidden bg-white shadow-[0_18px_44px_-22px_rgba(16,24,40,0.18)] border border-[#e6e9ee] rounded-3xl p-7">
    <h1 class="font-display text-xl font-semibold mb-1">Reset password</h1>
    <p class="text-sm text-[#6b7280] mb-5" id="resetHint">Enter your email and we will send you a reset code.</p>
    <label class="text-xs font-semibold text-[#3d4a45]">Email</label>
    <input id="resetEmail" type="email" class="field mt-1 mb-4" placeholder="you@email.com" autocomplete="username">
    <div id="resetStep2" class="hidden">
      <label class="text-xs font-semibold text-[#3d4a45]">Reset code (from your email)</label>
      <input id="resetCode" type="text" inputmode="numeric" class="field mt-1 mb-4" placeholder="8-digit code" autocomplete="one-time-code">
      <label class="text-xs font-semibold text-[#3d4a45]">New password</label>
      <input id="resetNewPw" type="password" class="field mt-1 mb-5" placeholder="At least 8 characters" autocomplete="new-password">
    </div>
    <button type="button" id="resetBtn" class="w-full px-6 py-3 rounded-2xl bg-[#0a6cf5] text-white font-semibold hover:bg-[#0856c8] transition active:scale-[0.99]">Send reset code</button>
    <div id="resetErr" class="text-sm text-rose-600 mt-3 hidden"></div>
    <button type="button" id="backToLogin" class="w-full text-center text-sm text-[#9aa0ab] font-semibold mt-3 hover:underline">Back to sign in</button>
  </div>
  <p class="text-center text-xs text-[#9aa0ab] mt-6">Vitality Weight Loss · Las Vegas</p>
</div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  // Milestone B: identity is Convex-native. Flip USE_CONVEX_AUTH=false to roll back to Supabase.
  const USE_CONVEX_AUTH = true;
  const SB='https://jtifhcvbgxqwlywugvjv.supabase.co', ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0aWZoY3ZiZ3hxd2x5d3Vndmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MDc5NTgsImV4cCI6MjA4ODA4Mzk1OH0.UfRVLuvM8_HPvKXUEDXb0cxR50znv16L5Tf99AnSc7g';
  const sb = createClient(SB, ANON, { auth:{ storageKey:'sb-vit-patient', persistSession:true } });
  // Auto-login removed on purpose: the portal login ALWAYS shows the form. This kills the
  // redirect loop and stops any cross-drop between the patient and staff paths.
  const f=document.getElementById('loginForm'), err=document.getElementById('err'), btn=document.getElementById('btn');
  f.addEventListener('submit', async (e)=>{
    e.preventDefault(); err.classList.add('hidden'); btn.textContent='Signing in…'; btn.disabled=true;
    const email=document.getElementById('email').value.trim().toLowerCase(), password=document.getElementById('password').value;
    try {
      if (USE_CONVEX_AUTH) {
        const { signIn, STORE_PATIENT } = await import('./auth-convex.js');
        await signIn(email, password, STORE_PATIENT);
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      // Optional deep-link: portal-login.html?next=m → companion PWA; default = full portal.
      // Only same-origin relative paths allowed (no open redirect).
      const params = new URLSearchParams(location.search);
      const raw = (params.get('next') || '').trim();
      let dest = 'portal.html';
      if (raw === 'm' || raw === 'm.html' || raw === '/m.html') dest = 'm.html';
      else if (raw === 'portal' || raw === 'portal.html' || raw === '/portal.html') dest = 'portal.html';
      else if (/^\/?[a-z0-9][a-z0-9._-]{0,40}\.html$/i.test(raw) && !raw.includes('..')) dest = raw.replace(/^\//,'');
      location.replace(dest);
    } catch(error){
      const raw = (error && (error.message || String(error))) || '';
      // Convex Auth throws InvalidAccountId (no such email) / InvalidSecret (wrong password).
      // Show one friendly line for any auth failure; never leak the raw server error.
      const isAuth = /invalidaccountid|invalidsecret|invalid|account|secret|password|credential|unauthor|401/i.test(raw);
      err.textContent = isAuth ? 'Invalid email or password.' : 'Sign in failed. Please try again.';
      err.classList.remove('hidden'); btn.textContent='Sign in'; btn.disabled=false;
    }
  });

  // ---- self-service password reset ----
  const resetPanel=document.getElementById('resetPanel'), forgotLink=document.getElementById('forgotLink'), backToLogin=document.getElementById('backToLogin');
  const resetEmail=document.getElementById('resetEmail'), resetStep2=document.getElementById('resetStep2'), resetCode=document.getElementById('resetCode'), resetNewPw=document.getElementById('resetNewPw'), resetBtn=document.getElementById('resetBtn'), resetErr=document.getElementById('resetErr'), resetHint=document.getElementById('resetHint');
  let resetStage=1;
  forgotLink.addEventListener('click', ()=>{ f.classList.add('hidden'); resetPanel.classList.remove('hidden'); resetEmail.value=(document.getElementById('email').value||'').trim(); });
  backToLogin.addEventListener('click', ()=>{ resetPanel.classList.add('hidden'); f.classList.remove('hidden'); });
  resetBtn.addEventListener('click', async ()=>{
    resetErr.classList.add('hidden');
    const mod = await import('./auth-convex.js');
    if(resetStage===1){
      const email=(resetEmail.value||'').trim().toLowerCase(); if(!email){ resetErr.textContent='Enter your email.'; resetErr.classList.remove('hidden'); return; }
      resetBtn.disabled=true; resetBtn.textContent='Sending…';
      try{ await mod.requestPasswordReset(email); }catch(_){}
      resetStage=2; resetStep2.classList.remove('hidden'); resetEmail.setAttribute('readonly','readonly');
      resetHint.textContent='If an account exists for that email, a code is on the way. Enter it below with a new password.';
      resetBtn.textContent='Reset password'; resetBtn.disabled=false; resetCode.focus();
    } else {
      const email=(resetEmail.value||'').trim().toLowerCase(), code=(resetCode.value||'').trim(), pw=resetNewPw.value||'';
      if(!code || pw.length<8){ resetErr.textContent='Enter the code and a new password (at least 8 characters).'; resetErr.classList.remove('hidden'); return; }
      resetBtn.disabled=true; resetBtn.textContent='Resetting…';
      try{ const { STORE_PATIENT } = mod; await mod.confirmPasswordReset(email, code, pw, STORE_PATIENT); location.replace('portal.html'); }
      catch(e){ resetErr.textContent=(e&&e.message)||'That code was not valid. Try again.'; resetErr.classList.remove('hidden'); resetBtn.disabled=false; resetBtn.textContent='Reset password'; }
    }
  });
</script>
</body>
</html>
